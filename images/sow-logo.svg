<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Main SOW Monogram -->
    <!-- Letter S -->
    <path d="M 60 40 
             C 120 40, 145 40, 150 40 
             L 138 75 
             C 115 75, 95 75, 75 75 
             C 65 75, 60 80, 58 87 
             C 55 95, 62 102, 75 105 
             L 115 113 
             C 145 119, 155 135, 148 158 
             C 140 185, 115 195, 70 195 
             L 5 195 
             L 18 160 
             C 45 160, 75 160, 95 160 
             C 107 160, 112 155, 115 147 
             C 118 138, 110 132, 98 129 
             L 60 121 
             C 28 115, 18 98, 25 76 
             C 32 50, 55 40, 60 40 Z" 
          fill="#FFFFFF" />

    <!-- Letter O (Cricket Ball Contour with Golden Seam) -->
    <!-- Outer White Ring -->
    <path d="M 230 40 
             C 285 40, 305 75, 295 118 
             C 285 160, 255 195, 200 195 
             C 145 195, 125 160, 135 118 
             C 145 75, 175 40, 230 40 Z
             M 222 72 
             C 185 72, 168 95, 162 118 
             C 156 142, 172 163, 208 163 
             C 245 163, 262 140, 268 118 
             C 274 95, 258 72, 222 72 Z" 
          fill="#FFFFFF" />

    <!-- Inner Golden Cricket Ball Seam Core -->
    <path d="M 195 155 
             C 215 130, 240 95, 255 60 
             C 240 75, 205 125, 185 145 Z" 
          fill="url(#goldGrad)" />
    <path d="M 188 160 
             C 205 138, 230 102, 245 70 
             C 235 85, 200 132, 180 152 Z" 
          fill="url(#goldGrad)" />
    <circle cx="184" cy="158" r="3.5" fill="#F59E0B" />
    <circle cx="253" cy="62" r="3.5" fill="#F59E0B" />

    <!-- Letter W (Dynamic Italic with Golden Aerodynamic Wing) -->
    <!-- Left Stem -->
    <path d="M 300 40 L 332 40 L 312 195 L 280 195 Z" fill="#FFFFFF" />
    <!-- Middle V -->
    <path d="M 332 40 L 362 40 L 350 145 L 372 40 L 402 40 L 365 195 L 332 195 Z" fill="#FFFFFF" />
    <!-- Right Golden Wing/Swoop -->
    <path d="M 390 195 
             L 425 105 
             C 445 70, 480 32, 510 15 
             C 485 35, 455 75, 435 125 
             L 415 195 Z" 
          fill="url(#goldGrad)" filter="url(#subtleGlow)" />

    <!-- Tagline 1: SPORT OF WICKET -->
    <text x="250" y="222" 
          text-anchor="middle" 
          fill="#FFFFFF" 
          font-family="'Plus Jakarta Sans', 'Roboto', sans-serif" 
          font-weight="800" 
          font-size="20" 
          letter-spacing="5">
      SPORT OF WICKET
    </text>

    <!-- Tagline 2: GEAR UP. PLAY ON. in Red Box -->
    <g transform="translate(10, 235)">
      <rect x="15" y="0" width="450" height="32" 
            fill="none" 
            stroke="#D03523" 
            stroke-width="2.5" 
            rx="2" />
      <text x="240" y="22" 
            text-anchor="middle" 
            fill="#FFFFFF" 
            font-family="'Plus Jakarta Sans', 'Roboto', sans-serif" 
            font-weight="900" 
            font-size="16" 
            letter-spacing="4">
        GEAR UP. PLAY ON.
      </text>
    </g>
  </g>
</svg>
